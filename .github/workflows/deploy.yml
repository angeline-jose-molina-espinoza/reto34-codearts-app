name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout codigo
      uses: actions/checkout@v3

    - name: Login Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build imagen
      run: docker build -t angelinecodearts/reto34-codearts-app:latest .

    - name: Push a Docker Hub
      run: docker push angelinecodearts/reto34-codearts-app:latest

    - name: Configurar kubectl
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

    - name: Desplegar nueva version en AKS
      run: kubectl rollout restart deployment/codearts-app
